services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: timing
      POSTGRES_PASSWORD: timing
      POSTGRES_DB: timing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timing -d timing"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://timing:timing@db:5432/timing
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  db_data:
